name: Build Multi-Platform Release

on:
  workflow_dispatch: # Activación manual desde GitHub Actions

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rid: win-x64
            extension: .exe
          - os: linux
            runner: ubuntu-latest
            rid: linux-x64
            extension: ""
          - os: macos
            runner: macos-latest
            rid: osx-x64
            extension: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained executable
        shell: bash
        run: |
          dotnet publish NBodiesSim/NBodiesSim.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o output/${{ matrix.os }}

      - name: Copy Data folder
        shell: bash
        run: |
          mkdir -p output/${{ matrix.os }}/Data
          cp NBodiesSim/Data/astrosData.json output/${{ matrix.os }}/Data/
          cp NBodiesSim/Data/astrosConfig.json output/${{ matrix.os }}/Data/

      - name: Create README
        shell: bash
        run: |
          cat > output/${{ matrix.os }}/README.txt << 'EOF'
          ========================================
          N-Bodies Simulator - Solar System
          ========================================

          INSTRUCCIONES:

          1. Asegúrate de que la carpeta "Data" está en el mismo directorio que el ejecutable
          2. Ejecuta el programa:
             - Windows: Doble clic en NBodiesSim.exe
             - Linux/macOS: ./NBodiesSim (puede requerir: chmod +x NBodiesSim)

          CONTROLES:

          - ESPACIO: Vista general del sistema solar
          - 0-9: Seleccionar planeta/astro
          - F1: Menú de ayuda
          - T: Menú de tiempo simulado
          - E: Menú de conservación de energía
          - H: HUD del planeta seleccionado (con datos de satélites si los tiene)
          - ESC: Salir

          NOTA: Los archivos Data/astrosData.json y Data/astrosConfig.json contienen las posiciones,
          velocidades iniciales y configuraciones de todos los cuerpos celestes. Puedes editarlos
          para modificar la simulación.

          Timesteps usados (n = substeps de integración RK4):
          - Vista general: 12 horas (43200s), n=300
          - Sol: 12 horas (43200s), n=300
          - Mercurio: 1 hora (3600s), n=300
          - Venus: 1 hora (3600s), n=300
          - Tierra: 1 hora (3600s), n=300
          - Marte: 400 segundos (~7 min), n=300
          - Júpiter: 30 minutos (1800s), n=300
          - Saturno: 30 minutos (1800s), n=300
          - Urano: 1 hora (3600s), n=300
          - Neptuno: 1 hora (3600s), n=300
          - Plutón: 30 minutos (1800s), n=300

          MEJORAS RECIENTES:
          - HUD por planeta: muestra masa, velocidad, posición y radio del cuerpo seleccionado
          - HUD de satélites: panel condicional con datos de cada satélite del planeta
          - Motor de física optimizado: arrays pre-asignados, cálculos RK4 inline
          - Optimización matemática: G*rij/r³ reduce llamadas a sqrt
          - IDs de tipo entero en todo el proyecto (preparado para integración con NASA JPL)
          - Limpieza de código: métodos no usados eliminados, variables temporales optimizadas

          ========================================
          EOF

      - name: Create ZIP package
        shell: bash
        run: |
          cd output/${{ matrix.os }}
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a -tzip ../../NBodiesSim-${{ matrix.os }}.zip *
          else
            zip -r ../../NBodiesSim-${{ matrix.os }}.zip *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NBodiesSim-${{ matrix.os }}
          path: NBodiesSim-${{ matrix.os }}.zip
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # N-Bodies Simulator - Solar System

          Simulación gravitatoria N-cuerpos del Sistema Solar con física realista.

          ## 📦 Descargas

          Descarga el archivo correspondiente a tu sistema operativo:

          - **Windows**: `NBodiesSim-windows.zip`
          - **Linux**: `NBodiesSim-linux.zip`
          - **macOS**: `NBodiesSim-macos.zip`

          ## 🚀 Instalación

          ### Windows
          1. Descarga y extrae el ZIP
          2. Ejecuta `NBodiesSim.exe`

          ### Linux
          1. Descarga y extrae: `unzip NBodiesSim-linux.zip`
          2. Da permisos: `chmod +x NBodiesSim`
          3. Ejecuta: `./NBodiesSim`

          ### macOS
          1. Descarga y extrae el ZIP
          2. Da permisos: `chmod +x NBodiesSim`
          3. Ejecuta: `./NBodiesSim`
          4. Si macOS bloquea: Preferencias del Sistema > Privacidad y Seguridad > "Abrir de todas formas"

          ## 🎮 Controles

          - **ESPACIO**: Vista general del sistema solar
          - **0-9**: Seleccionar planeta (0=Sol, 1=Mercurio, 2=Venus, etc.)
          - **F1**: Menú de ayuda
          - **T**: Menú de tiempo simulado
          - **E**: Menú de conservación de energía
          - **H**: HUD del planeta seleccionado (con datos de satélites si los tiene)
          - **ESC**: Salir

          ## ⚙️ Características

          ### Simulación
          - 8 planetas + Sol + Plutón
          - 13+ satélites naturales (Luna, Galileanos, Titán, etc.)
          - Física gravitatoria N-cuerpos completa con Runge-Kutta 4 (RK4)
          - Motor de física optimizado: arrays pre-asignados, cálculos RK4 inline
          - Timesteps adaptativos según el cuerpo observado
          - Estabilidad validada durante 1,765+ años simulados
          - Conservación de energía: error acumulado ±1.89e-7

          ### Interfaz
          - HUD por planeta: masa, velocidad, posición y radio
          - HUD de satélites: panel condicional con datos de cada satélite
          - Menú de ayuda (F1), tiempo simulado (T) y conservación de energía (E)
          - Anillos planetarios (Saturno, Urano, Neptuno)
          - Cinturón de asteroides y cinturón de Kuiper
          - Trazas orbitales con gradiente de transparencia
          - 10,000 estrellas de fondo generadas proceduralmente
          - 60 FPS estables incluso después de horas

          ## ⚠️ Limitaciones Conocidas

          - **Decay orbital lento**: Fobos muestra decaimiento de ~69 m/año por acumulación numérica
          - **Causa**: Errores numéricos + condiciones iniciales no realistas (cuerpos alineados)
          - **Impacto**: Mínimo - tomaría ~47,000 años simulados para efectos significativos
          - **Mitigación futura**: Integración con datos reales de NASA JPL Horizons eliminará este artefacto

          ## 📋 Requisitos

          - **Windows**: Windows 10/11 (64-bit)
          - **Linux**: GLIBC 2.31+ y drivers OpenGL
          - **macOS**: macOS 10.15+ (Catalina o superior)

          ## 📝 Notas

          - Cada ejecutable incluye el runtime de .NET (~70 MB)
          - No requiere instalación de dependencias
          - Los archivos `Data/astrosData.json` y `Data/astrosConfig.json` contienen los parámetros orbitales y configuraciones de cámara
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/NBodiesSim-windows/NBodiesSim-windows.zip
            artifacts/NBodiesSim-linux/NBodiesSim-linux.zip
            artifacts/NBodiesSim-macos/NBodiesSim-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
