name: Build Multi-Platform Release

on:
  workflow_dispatch: # Manual trigger from GitHub Actions

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rid: win-x64
            extension: .exe
          - os: linux
            runner: ubuntu-latest
            rid: linux-x64
            extension: ""
          - os: macos
            runner: macos-latest
            rid: osx-x64
            extension: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained executable
        shell: bash
        run: |
          dotnet publish NBodiesSim/NBodiesSim.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o output/${{ matrix.os }}

      - name: Copy Data folder
        shell: bash
        run: |
          mkdir -p output/${{ matrix.os }}/Data
          cp NBodiesSim/Data/astrosData.json output/${{ matrix.os }}/Data/
          cp NBodiesSim/Data/astrosConfig.json output/${{ matrix.os }}/Data/

      - name: Create README
        shell: bash
        run: |
          cat > output/${{ matrix.os }}/README.txt << 'EOF'
          ========================================
          N-Bodies Simulator - Solar System
          ========================================

          INSTRUCTIONS:

          1. Make sure the "Data" folder is in the same directory as the executable
          2. Run the program:
             - Windows: Double-click NBodiesSim.exe
             - Linux/macOS: ./NBodiesSim (may require: chmod +x NBodiesSim)

          CONTROLS:

          - SPACE: Wide view of the Solar System
          - 0-9: Select planet/body
          - F1: Help menu
          - T: Simulated time menu
          - E: Energy conservation menu
          - H: Selected body HUD (with satellite data if available)
          - ESC: Exit

          NOTE: The files Data/astrosData.json and Data/astrosConfig.json contain the positions,
          initial velocities, and configurations for all celestial bodies. You can edit them
          to modify the simulation.

          Timesteps used (n = RK4 integration substeps):
          - Wide view: 12 hours (43200s), n=300
          - Sun: 12 hours (43200s), n=300
          - Mercury: 1 hour (3600s), n=300
          - Venus: 1 hour (3600s), n=300
          - Earth: 1 hour (3600s), n=300
          - Mars: 400 seconds (~7 min), n=300
          - Jupiter: 30 minutes (1800s), n=300
          - Saturn: 30 minutes (1800s), n=300
          - Uranus: 1 hour (3600s), n=300
          - Neptune: 1 hour (3600s), n=300
          - Pluto: 30 minutes (1800s), n=300

          RECENT IMPROVEMENTS:
          - Per-body HUD: displays mass, velocity, position and radius of the selected body
          - Satellite HUD: conditional panel with data for each satellite
          - Optimized physics engine: pre-allocated arrays, inline RK4 calculations
          - Math optimization: G*rij/r^3 reduces sqrt calls
          - Integer IDs across the project (prepared for NASA JPL integration)
          - Code cleanup: unused methods removed, temporary variables optimized

          ========================================
          EOF

      - name: Create ZIP package
        shell: bash
        run: |
          cd output/${{ matrix.os }}
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a -tzip ../../NBodiesSim-${{ matrix.os }}.zip *
          else
            zip -r ../../NBodiesSim-${{ matrix.os }}.zip *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NBodiesSim-${{ matrix.os }}
          path: NBodiesSim-${{ matrix.os }}.zip
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # N-Bodies Simulator - Solar System

          Realistic N-body gravitational simulation of the Solar System.

          ## 📦 Downloads

          Download the file for your operating system:

          - **Windows**: `NBodiesSim-windows.zip`
          - **Linux**: `NBodiesSim-linux.zip`
          - **macOS**: `NBodiesSim-macos.zip`

          ## 🚀 Installation

          ### Windows
          1. Download and extract the ZIP
          2. Run `NBodiesSim.exe`

          ### Linux
          1. Download and extract: `unzip NBodiesSim-linux.zip`
          2. Grant permissions: `chmod +x NBodiesSim`
          3. Run: `./NBodiesSim`

          ### macOS
          1. Download and extract the ZIP
          2. Grant permissions: `chmod +x NBodiesSim`
          3. Run: `./NBodiesSim`
          4. If macOS blocks it: System Preferences > Privacy & Security > "Open Anyway"

          ## 🎮 Controls

          - **SPACE**: Wide view of the Solar System
          - **0-9**: Select planet (0=Sun, 1=Mercury, 2=Venus, etc.)
          - **F1**: Help menu
          - **T**: Simulated time menu
          - **E**: Energy conservation menu
          - **H**: Selected body HUD (with satellite data if available)
          - **ESC**: Exit

          ## ⚙️ Features

          ### Simulation
          - 8 planets + Sun + Pluto
          - 13+ natural satellites (Moon, Galilean moons, Titan, etc.)
          - Full N-body gravitational physics with Runge-Kutta 4 (RK4)
          - Optimized physics engine: pre-allocated arrays, inline RK4 calculations
          - Adaptive timesteps based on the observed body
          - Stability validated over 1,765+ simulated years
          - Energy conservation: accumulated error ±1.89e-7

          ### Interface
          - Per-body HUD: mass, velocity, position and radius
          - Satellite HUD: conditional panel with data for each satellite
          - Help menu (F1), simulated time (T) and energy conservation (E)
          - Planetary rings (Saturn, Uranus, Neptune)
          - Asteroid belt and Kuiper belt
          - Orbital trails with transparency gradient
          - 10,000 procedurally generated background stars
          - Stable 60 FPS even after hours of simulation

          ## ⚠️ Known Limitations

          - **Slow orbital decay**: Phobos shows ~69 m/year decay due to numerical accumulation
          - **Cause**: Numerical errors + unrealistic initial conditions (aligned bodies)
          - **Impact**: Minimal - would take ~47,000 simulated years for significant effects
          - **Future mitigation**: Integration with real NASA JPL Horizons data will eliminate this artifact

          ## 📋 Requirements

          - **Windows**: Windows 10/11 (64-bit)
          - **Linux**: GLIBC 2.31+ and OpenGL drivers
          - **macOS**: macOS 10.15+ (Catalina or later)

          ## 📝 Notes

          - Each executable includes the .NET runtime (~70 MB)
          - No dependency installation required
          - The files `Data/astrosData.json` and `Data/astrosConfig.json` contain the orbital parameters and camera configurations
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/NBodiesSim-windows/NBodiesSim-windows.zip
            artifacts/NBodiesSim-linux/NBodiesSim-linux.zip
            artifacts/NBodiesSim-macos/NBodiesSim-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
